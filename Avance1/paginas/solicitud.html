<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Solicitud de participación | Innovation Hub</title><link rel="stylesheet" href="../css/bootstrap-custom.css"><link rel="stylesheet" href="../css/estilos.css"></head>
<body data-page="participation">
  <header class="site-header"><nav class="navbar navbar-expand-lg" aria-label="Navegación principal"><div class="container"><a class="navbar-brand fw-bold" href="../index.html">Innovation Hub</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Abrir menú"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2"><li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li><li class="nav-item"><a class="nav-link" href="iniciativas.html">Explorar iniciativas</a></li><li class="nav-item"><a class="nav-link" href="perfil.html">Perfil de ejemplo</a></li><li class="nav-item"><a class="btn btn-success ms-lg-2" href="registro-iniciativa.html">Publicar iniciativa</a></li></ul></div></div></nav></header>
  <main class="container section-space"><div id="globalStatus" aria-live="polite"></div><div class="row justify-content-center"><div class="col-12 col-lg-8"><p><a href="iniciativas.html">← Volver al catálogo</a></p><header class="mb-4"><p class="text-success fw-bold mb-1">Sumate al equipo</p><h1>Solicitud de participación</h1><p>Iniciativa: <strong id="requestInitiative">Cargando…</strong></p></header><div id="requestStatus" aria-live="polite"></div>
    <form id="participationForm" class="card form-card" novalidate><div class="card-body p-4 p-lg-5">
      <div class="mb-3"><label for="mensaje" class="form-label">Mensaje de presentación <span aria-hidden="true">*</span></label><textarea id="mensaje" name="mensaje" class="form-control" rows="4" maxlength="600" required placeholder="Contá por qué te interesa esta iniciativa y qué podés aportar."></textarea><div id="error-mensaje" class="field-error" data-error-for="mensaje"></div></div>
      <div class="mb-3"><label for="competencia" class="form-label">Competencia principal que aportás <span aria-hidden="true">*</span></label><select id="competencia" name="competencia" class="form-select" required><option value="">Cargando competencias…</option></select><div id="error-competencia" class="field-error" data-error-for="competencia"></div></div>
      <div class="mb-3"><label for="rol" class="form-label">Rol deseado <span aria-hidden="true">*</span></label><input id="rol" name="rol" class="form-control" maxlength="80" required placeholder="Ejemplo: diseño de interfaz"><div id="error-rol" class="field-error" data-error-for="rol"></div></div>
      <div class="mb-4"><label for="disponibilidad" class="form-label">Disponibilidad <span aria-hidden="true">*</span></label><input id="disponibilidad" name="disponibilidad" class="form-control" maxlength="120" required placeholder="Ejemplo: 4 horas por semana, tardes"><div id="error-disponibilidad" class="field-error" data-error-for="disponibilidad"></div></div>
      <button class="btn btn-primary btn-lg" type="submit">Enviar solicitud</button>
    </div></form></div></div></main>
  <footer class="site-footer py-4"><div class="container"><span class="fw-bold">Innovation Hub</span></div></footer>
  <script src="../js/storage.js"></script><script src="../js/fallback-data.js"></script><script src="../js/ui.js"></script><script src="../js/data.js"></script><script src="../js/validation.js"></script><script src="../js/participation.js"></script><script src="../js/app.js"></script>
</body></html>
